<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EPIC - Game Edukasi Budaya Madura">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EPIC App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EPIC - Game Edukasi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Script untuk memaksa hapus cache / service worker lama agar update langsung terbaca -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          // Unregister semua service worker untuk mencegah load versi lama (blank screen)
          registration.unregister();
        }
      });
    }
    // Tambahkan timestamp untuk menghindari cache pada flutter_bootstrap
    const script = document.createElement("script");
    script.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>

  <!-- Firebase SDK (wajib untuk Flutter Web) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  </script>
</body>
</html>
